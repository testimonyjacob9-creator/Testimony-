# Render Blueprint for OLIVES. One always-on background worker + one persistent disk.
# Persistent disks require a PAID Render instance type; on the free tier files vanish on every deploy/restart.
# Secrets are NOT in this file: Render asks for every `sync: false` value in the dashboard.
services:
  - type: worker
    name: olives-assistant
    runtime: node
    plan: starter          # smallest paid type; a disk is not available on free instances
    numInstances: 1        # MUST stay 1: one WhatsApp session + one SQLite file + one scheduler
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    disk:
      name: olives-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR            # SQLite DB, WhatsApp auth_state and media all live under here
        value: /var/data
      - key: TIMEZONE
        value: Africa/Lagos
      - key: OWNER_PHONE         # e.g. 2347065702702 (digits only)
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY      # paste in the Render dashboard only; never commit it
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_DAILY_REQUEST_LIMIT
        value: "300"
      # Stays "mock" (sends nothing) until you explicitly approve going live: see docs/GO_LIVE.md.
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: ACCOUNT_MODE
        value: self
